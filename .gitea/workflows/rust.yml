name: Rust checks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: rust-latest

    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin http://server.in.svart.io/gitea/${GITHUB_REPOSITORY}.git
          AUTH="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git -c "http.http://server.in.svart.io/gitea/.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy for default features
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run clippy for all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check default build without features
        run: cargo build --locked

      - name: Check todoist feature build
        run: cargo build --locked --features todoist

      - name: Check web feature build
        run: cargo build --locked --features web

      - name: Check all feature build
        run: cargo build --locked --all-features

      - name: Run default tests
        run: cargo test --locked

      - name: Run todoist feature tests
        run: cargo test --locked --features todoist

      - name: Run web feature tests
        run: cargo test --locked --features web

      - name: Run combined feature tests
        run: cargo test --locked --features todoist,web

      - name: Check default help
        run: cargo run --locked -- --help

      - name: Check todoist help
        run: cargo run --locked --features todoist -- --help

      - name: Check web help
        run: cargo run --locked --features web -- --help

      - name: Build release binary
        run: cargo build --locked --release
