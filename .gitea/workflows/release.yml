name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release-x86_64-musl:
    name: x86_64 musl
    runs-on: rust-musl-x86_64

    steps:
      - name: Checkout tag
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "http://server.in.svart.io/gitea/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git -c "http.http://server.in.svart.io/gitea/.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git checkout --detach "${GITHUB_REF_NAME}"

      - name: Build release binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          target="x86_64-unknown-linux-musl"
          name="pkms-${GITHUB_REF_NAME}-${target}"
          mkdir -p dist "$name"
          cp "target/${target}/release/pkms" "$name/pkms"
          tar -czf "dist/${name}.tar.gz" "$name"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - name: Publish release assets
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          sh .gitea/workflows/scripts/publish-release-assets.sh dist/*

  release-aarch64-musl:
    name: aarch64 musl
    runs-on: rust-musl-aarch64
    needs: release-x86_64-musl

    steps:
      - name: Checkout tag
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "http://server.in.svart.io/gitea/${GITHUB_REPOSITORY}.git"
          AUTH="$(printf 'x-access-token:%s' "$GITEA_TOKEN" | base64 -w0)"
          git -c "http.http://server.in.svart.io/gitea/.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git checkout --detach "${GITHUB_REF_NAME}"

      - name: Build release binary
        run: cargo build --locked --release --target aarch64-unknown-linux-musl

      - name: Package
        run: |
          target="aarch64-unknown-linux-musl"
          name="pkms-${GITHUB_REF_NAME}-${target}"
          mkdir -p dist "$name"
          cp "target/${target}/release/pkms" "$name/pkms"
          tar -czf "dist/${name}.tar.gz" "$name"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

      - name: Publish release assets
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          sh .gitea/workflows/scripts/publish-release-assets.sh dist/*
