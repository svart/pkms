[package]
name = "pkms"
version = "1.8.0"
edition = "2024"

[features]
default = []
todoist = ["dep:ureq", "ureq/platform-verifier"]
web = ["dep:katex", "dep:syntect"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
glob = "0.3"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
rayon = "1"
tiktoken-rs = "0.11"
tabled = { version = "0.20", default-features = false, features = ["std"] }
terminal_size = "0.4"
handlebars = "6"
# Keep shlex on the 1.x line to share the transitive build-dependency version
# and minimize the dependency tree.
shlex = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std"] }
ureq = { version = "3.3.0", optional = true, features = ["json"] }
katex = { version = "0.4.6", optional = true }
syntect = { version = "5.3.0", optional = true }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dev-dependencies]
tempfile = "3"
proptest = "1"
insta = "1"
