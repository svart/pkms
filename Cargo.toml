[package]
name = "pkms"
version = "0.50.4"
edition = "2024"

[features]
default = []
embed = ["dep:fastembed"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
glob = "0.3"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rayon = "1"
tiktoken-rs = "0.11"
fastembed = { version = "5.13.4", optional = true }
tabled = "0.20"
terminal_size = "0.4"
handlebars = "6"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dev-dependencies]
tempfile = "3"
proptest = "1"
insta = "1"
