[package]
name = "pkms"
version = "1.2.3"
edition = "2024"

[features]
default = []
embed = ["dep:fastembed"]
todoist = ["dep:ureq", "ureq/platform-verifier"]
web = ["dep:katex", "dep:syntect"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
glob = "0.3"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rayon = "1"
tiktoken-rs = "0.11"
fastembed = { version = "5.13.4", optional = true }
tabled = "0.20"
terminal_size = "0.4"
handlebars = "6"
shlex = "2.0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "3.3.0", optional = true, features = ["json"] }
katex = { version = "0.4.6", optional = true }
syntect = { version = "5.3.0", optional = true }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dev-dependencies]
tempfile = "3"
proptest = "1"
insta = "1"
