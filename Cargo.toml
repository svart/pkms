[package]
name = "pkms"
version = "0.19.0"
edition = "2024"

[features]
default = []
embed = ["dep:fastembed"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
glob = "0.3"
anyhow = "1"
chrono = "0.4"
dirs = "6"
rayon = "1"
tiktoken-rs = "0.11"
fastembed = { version = "5.13.4", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"
insta = "1"
