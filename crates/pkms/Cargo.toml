[package]
name = "pkms"
version = "1.12.3"
description = "CLI for navigating and maintaining org-roam personal knowledge base + todo CLI"
edition = "2024"
license = "MIT"

[features]
default = []
todoist = ["pkms-task/todoist"]
web = ["dep:pkms-web", "pkms-web/web"]
ssh = ["pkms-db/ssh"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
walkdir = "2"
glob = "0.3"
anyhow = "1"
pkms-db = { path = "../pkms-db" }
pkms-org = { path = "../pkms-org" }
pkms-task = { path = "../pkms-task" }
pkms-web = { path = "../pkms-web", optional = true, default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
tiktoken-rs = "0.11"
tabled = { version = "0.20", default-features = false, features = ["std"] }
terminal_size = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std"] }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dev-dependencies]
tempfile = "3"
proptest = "1"
insta = "1"
