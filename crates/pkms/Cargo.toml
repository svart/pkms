[package]
name = "pkms"
version = "2.8.1"
description = "CLI for navigating and maintaining org-roam personal knowledge base + todo CLI"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[features]
default = []
web = ["dep:pkms-web"]
ssh = ["pkms-db/ssh"]
rag = ["dep:pkms-rag"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
pkms-db = { path = "../pkms-db" }
pkms-org = { path = "../pkms-org" }
pkms-rag = { path = "../pkms-rag", optional = true }
pkms-task = { path = "../pkms-task" }
pkms-tokens = { path = "../pkms-tokens" }
pkms-web = { path = "../pkms-web", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
tabled = { version = "0.21", default-features = false, features = ["std"] }
terminal_size = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "std"] }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[dev-dependencies]
tempfile = "3"
insta = "1"
