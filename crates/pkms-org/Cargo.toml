[package]
name = "pkms-org"
version = "2.3.1"
description = "Org parsing and editing primitives for pkms"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
glob = "0.3"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
shlex = "2.0"
tracing = "0.1"
uuid = "1"
walkdir = "2"

[dev-dependencies]
proptest = "1"
serde_json = "1"
tempfile = "3"
