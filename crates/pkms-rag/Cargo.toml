[package]
name = "pkms-rag"
version = "1.12.3"
description = "Local retrieval over org-roam notes for pkms"
edition = "2024"
license = "MIT"

[features]
default = ["fastembed"]
fastembed = ["dep:fastembed"]

[dependencies]
anyhow = "1"
axum = "0.8.9"
blake2 = "0.10.6"
fastembed = { version = "5.17.2", optional = true }
pkms-org = { path = "../pkms-org" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
