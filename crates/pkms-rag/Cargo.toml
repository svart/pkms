[package]
name = "pkms-rag"
version = "1.12.3"
description = "Local retrieval over org-roam notes for pkms"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
pkms-org = { path = "../pkms-org" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
