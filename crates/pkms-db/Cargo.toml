[package]
name = "pkms-db"
version = "1.12.3"
description = "Note database command logic for pkms"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
pkms-org = { path = "../pkms-org" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
