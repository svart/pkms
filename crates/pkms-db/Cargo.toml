[package]
name = "pkms-db"
version = "2.3.6"
description = "Note database command logic for pkms"
edition = "2024"
license = "MIT"

[features]
default = []
ssh = ["dep:russh", "dep:russh-sftp", "dep:tokio"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
pkms-org = { path = "../pkms-org" }
pkms-tokens = { path = "../pkms-tokens" }
rayon = "1"
regex = "1"
russh = { version = "0.62.2", optional = true }
russh-sftp = { version = "2.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["io-util", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
